# MySQL Database Configuration (Password loaded dynamically from prompt/file)
spring.datasource.url=jdbc:mysql://localhost:3306/report_card_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Server
server.port=8080

# Logging (DEBUG for SQL queries; easy to see what runs)
logging.level.org.springframework.jdbc=DEBUG
logging.level.com.zaxxer.hikari=INFO
logging.level.org.springframework=INFO